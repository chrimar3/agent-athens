      - απαράμιλλη
      - απαράμιλλο
      - απαράμιλλου
      - απαράμιλλης
      - απαράμιλλοι
      - απαράμιλλες
      - απαράμιλλα
      - απαράμιλλων
      - απαράμιλλους

      # ─── μαγευτικός — "spellbinding / enchanting" (v1.1) ───────────────────
      # Note: "μαγευτική ατμόσφαιρα" already covered as fixed phrase below.
      # Adjective-family entry catches all other deployments
      # (e.g., "μαγευτική βραδιά", "μαγευτικό σόλο").
      - μαγευτικός
      - μαγευτική
      - μαγευτικό
      - μαγευτικού
      - μαγευτικής
      - μαγευτικοί
      - μαγευτικές
      - μαγευτικά
      - μαγευτικών
      - μαγευτικούς

      # ─── Σταθερές φράσεις (fixed phrases — όλες οι παραλλαγές) ─────────────
      - μη χάσετε
      - μη χάσεις
      - μην χάσετε
      - μην χάσεις
      - κρυφό στολίδι
      - κρυφά στολίδια
      - κρυφό διαμάντι
      - κρυφά διαμάντια

      # ─── Discovery narrative (ΜΕΡΟΣ 10 §10) ────────────────────────────────
      - ανακαλύπτεται ξανά
      - ανακαλύψτε την Αθήνα
      - ανακάλυψε την Αθήνα

      # ─── Promotional ατμόσφαιρα tropes ─────────────────────────────────────
      - μαγευτική ατμόσφαιρα
      - μαγική ατμόσφαιρα
      - μυσταγωγική ατμόσφαιρα

    contextual:
      # Σημείωση: όλα τα contextual entries χρησιμοποιούν regex στο phrase field
      # ώστε να καλύπτουν όλες τις κλίσεις του ίδιου επιθέτου με μία
      # καταχώρηση. banned_when / allowed_when σε αγγλικά (judge-prompt
      # working language — βλ. Note 1).

      - phrase: "re:\\bζωντανός\\b|\\bζωντανή\\b|\\bζωντανό\\b|\\bζωντανού\\b|\\bζωντανής\\b|\\bζωντανοί\\b|\\bζωντανές\\b|\\bζωντανά\\b|\\bζωντανών\\b|\\bζωντανούς\\b"
        banned_when: "Used as an adjective describing atmosphere, energy, or vibe (e.g., 'ζωντανή ατμόσφαιρα', 'ζωντανή ενέργεια', 'ζωντανή βραδιά'). The word becomes empty marketing when applied to ambience rather than performance type."
        allowed_when: "Used as a performance-type designation (e.g., 'ζωντανή μουσική' = live music, 'ζωντανή εκτέλεση' = live performance, 'ζωντανή ηχογράφηση' = live recording). Greek genre nomenclature, must be permitted."

      - phrase: "re:\\bκορυφαίος\\b|\\bκορυφαία\\b|\\bκορυφαίο\\b|\\bκορυφαίου\\b|\\bκορυφαίας\\b|\\bκορυφαίοι\\b|\\bκορυφαίες\\b|\\bκορυφαίων\\b|\\bκορυφαίους\\b"
        banned_when: "Used as floating praise without factual backing in the same sentence or adjacent clause (e.g., 'κορυφαίο venue', 'κορυφαία βραδιά', 'κορυφαίος καλλιτέχνης'). Equivalent to English 'world-class' deployed without evidence."
        allowed_when: "Used with measurable factual backing immediately following (e.g., 'κορυφαίος μπασίστας της σκηνής, με 30 χρόνια στο Half Note και τρεις δίσκους με τον Διονύση Σαββόπουλο'). The justification must be a verifiable fact, not another vague descriptor."

      - phrase: "re:\\bμοναδικός\\b|\\bμοναδική\\b|\\bμοναδικό\\b|\\bμοναδικού\\b|\\bμοναδικής\\b|\\bμοναδικοί\\b|\\bμοναδικές\\b|\\bμοναδικά\\b|\\bμοναδικών\\b|\\bμοναδικούς\\b"
        banned_when: "Used without a concrete factual differentiator immediately following (e.g., 'μοναδική εμπειρία', 'μοναδικός χώρος', 'μοναδική βραδιά'). The word adds no information — same failure mode as English 'unique' as floating descriptor."
        allowed_when: "Used with a concrete verifiable differentiator immediately following (e.g., 'μοναδικός εξώστης με θέα στην Ακρόπολη χωρίς ενδιάμεσο κτίριο', 'μοναδικό αρχιτεκτονικό στοιχείο που σώζεται από το 1891'). The differentiator must be a specific fact, not another vague claim."
