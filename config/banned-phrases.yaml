      # ─── εκπληκτικός — "phenomenal / amazing" (v1.1) ───────────────────────
      # Common AI-generated-Greek tic, parallel to English "amazing".
      - εκπληκτικός
      - εκπληκτική
      - εκπληκτικό
      - εκπληκτικού
      - εκπληκτικής
      - εκπληκτικοί
      - εκπληκτικές
      - εκπληκτικά
      - εκπληκτικών
      - εκπληκτικούς

      # ─── απαράμιλλος — "unparalleled" (v1.1) ───────────────────────────────
