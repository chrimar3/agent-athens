# banned-phrases.yaml
# Owner:     Editorial Director (ED)
# Consumers: F1 quality-gate batch — C1 mechanical match, C2 contextual judge
#            EW prompt — buildPrompt + buildPremiumPrompt
# For:       S100c (F1 quality-gate dedupe / hardcoded list removal)
# Updated:   2026-04-30
# Version:   1.1
#
# ─── Changelog ────────────────────────────────────────────────────────────────
#   v1.1 (2026-04-30) — S100c reconciliation pass
#     + EN absolute: restored 15 terms from F1 hardcoded LAZY_ADJECTIVES
#       (fantastic, wonderful, great, excellent, perfect, spectacular,
#        extraordinary, exceptional, immersive, remarkable, phenomenal,
#        unparalleled, transcendent, awe-inspiring, spellbinding).
#       v1.0 used content-types.md L478 as sole canonical source — L478 was
#       illustrative, not exhaustive. F1 hardcoded list now folded in as
#       co-canonical.
#     + EL absolute: parallel expansion — 8 new Greek adjective families
#       with full inflections to maintain symmetry across languages.
#       Includes εξαιρετικός family (explicitly flagged in ED-greek-writing-
#       guide §9 as bad: "εξαιρετική ακουστική" = banned floating descriptor).
#     = EN contextual: unchanged. world-class, iconic, legendary, live,
#       unique, premier all stay contextual per editorial parallel with
#       Greek κορυφαίος / μοναδικός / ζωντανός in ED guide §8.
#
#   v1.0 (2026-04-29) — initial seed for S100b
#
# ─── Schema contract ──────────────────────────────────────────────────────────
#   banned.{lang}.absolute     → flat list of strings; loader does word-boundary
#                                substring match against description text.
#   banned.{lang}.contextual   → list of objects:
#       phrase       — string (literal) OR string prefixed with `re:` (regex).
#                      Greek contextual entries use regex to cover all
#                      inflections in a single rule; EN entries use literals.
#       banned_when  — English-language judge prompt context (Note 1).
#       allowed_when — English-language judge prompt context (Note 1).
#
# ─── Note 1 — judge-prompt language ───────────────────────────────────────────
#   F1 batches C1–C6 in one Claude call whose working language is English.
#   banned_when / allowed_when are operator-readable English regardless of
#   phrase language. Claude's Greek competence handles phrase recognition; the
#   judge needs the rule in its working language to apply it consistently.
#
# ─── Note 2 — regex engine compatibility ──────────────────────────────────────
#   v1.0 ack: JavaScript RegExp's `\b` is ASCII-only, which mis-handles Greek
#   word boundaries. Per Dev Planner, S100b loader has a workaround in place
#   (likely a pre-tokenization pass or Unicode property classes). Patterns
#   below remain `\b`-anchored — loader-side handling is canonical, the seed
#   stays in standard regex notation. If the workaround changes, flag and we
#   re-emit patterns to match the engine.
#
# ─── Note 3 — single canonical list, both consumers ───────────────────────────
#   EW prompt and F1 quality-gate read from the same lists. Different lists
#   per consumer (Option 3 in S100c reconciliation) was rejected: contextual
#   treatment of world-class / iconic / legendary is editorially *correct*,
#   not lenient. F1 catches what EW failed to avoid — different layers, same
#   standard.
#
# ─── Note 4 — sources ─────────────────────────────────────────────────────────
#   EN absolute, original line:    content-types.md L478
#   EN absolute, F1 carryforward:  quality-gates.ts:106-119 LAZY_ADJECTIVES (pre-S100c)
#   EN PR-speak qualifier:         content-types.md L169
#   EN vibe-fabrication patterns:  editorial-decisions.md L321 hallucination taxonomy
#                                  + ED system prompt First Sentence Rule examples
#   EL absolute canonical:         ED-greek-writing-guide.md ΜΕΡΟΣ 8
#   EL "εξαιρετική ακουστική":     ED-greek-writing-guide.md ΜΕΡΟΣ 9 (Δείξε, Μην Πες)
#   EL outsider-tell additions:    ED-greek-writing-guide.md ΜΕΡΟΣ 10 §10
#
# ─── Note 5 — editorial promotions, EN absolute → contextual ──────────────────
#   These four EN entries appeared in the F1 hardcoded list as absolute but
#   are contextual here. The Greek guide §8 explicitly treats their EL
#   counterparts as contextual ("OK with factual backing"). The EN parallel
#   must match — banning them absolutely produces false positives in writing
#   we explicitly want (e.g., "Half Note is world-class — the Wednesday jam
#   has run continuously since 1979 with rotating international rhythm
#   sections" should pass).
#     - world-class  ↔ κορυφαίος
#     - iconic       ↔ no direct EL parallel; same logic
#     - legendary    ↔ no direct EL parallel; same logic
#     - live         ↔ ζωντανός (genre nomenclature must be permitted)
#   Plus `unique` and `premier` added per v1.0 reasoning (μοναδικός parallel
#   and PR-speak intensifier with proper-noun exceptions).

banned:
  en:
    absolute:
      # ─── Marketing-speak (canonical, content-types.md L478) ────────────────
      - amazing
      - incredible
      - vibrant
      - stunning
      - breathtaking
      - unforgettable
      - must-see
      - hidden gem
      # ─── PR-speak qualifiers (content-types.md L169) ───────────────────────
      - premier destination
      - state-of-the-art
      # ─── Generic-praise lazy adjectives ────────────────────────────────────
      # Restored from F1 hardcoded LAZY_ADJECTIVES in v1.1.
      # All fail the substitution test. `great` and `perfect` have edge-case
      # functional uses ("great for solo dinner") — kept absolute on the
      # principle that F1 over-flags catch lazy copy at the cost of a small
      # ED override burden, which is the correct tradeoff.
      - fantastic
      - wonderful
      - great
      - excellent
      - perfect
      - extraordinary
      - exceptional
      - remarkable
      - phenomenal
      - unparalleled
      # ─── Vibe-fabrication adjectives ───────────────────────────────────────
      # Atmospheric/experiential claims that require physical presence.
      # Some restored from F1 list (spectacular, immersive, transcendent,
      # awe-inspiring, spellbinding); others (mesmerizing, captivating)
      # held over from v1.0.
      - spectacular
      - immersive
      - transcendent
      - awe-inspiring
      - spellbinding
      - mesmerizing
      - captivating
      # ─── Vibe-fabrication phrases ──────────────────────────────────────────
      - intimate candlelit
      - leans in as the lights dim
      - electric atmosphere
      - magical atmosphere
      - enchanting atmosphere
      # ─── Discovery / invitation tropes ─────────────────────────────────────
      # Openings that function as vibe transport rather than citation anchors.
      # Direct conflict with First Sentence Rule.
      - step into
      - immerse yourself
      - whisks you away
      - transports you

    contextual:
      - phrase: live
        banned_when: "Used as an adjective describing atmosphere, energy, or vibe (e.g., 'live atmosphere', 'live energy', 'live vibe'). The word becomes empty marketing-speak when applied to ambience rather than performance type."
        allowed_when: "Used as a performance-type designation (e.g., 'live music', 'live performance', 'live set', 'live recording', 'live album'). This is genre and format nomenclature and must be permitted."

      - phrase: unique
        banned_when: "Used without a specific factual differentiator immediately following (e.g., 'unique experience', 'a unique venue', 'truly unique offering'). Fails the substitution test — the word adds no information."
        allowed_when: "Used with a concrete, verifiable differentiator immediately following or in the same sentence (e.g., 'unique in being the only Athens venue with surviving 1891 acoustics'). The differentiator must be a specific fact, not another vague descriptor."

      - phrase: world-class
        banned_when: "Used as floating praise without supporting evidence in the same sentence or adjacent clause (e.g., 'world-class venue', 'world-class lineup', 'world-class production')."
        allowed_when: "Used with measurable factual backing in the same sentence or adjacent clause (e.g., 'Half Note is world-class by any measure — the Wednesday jam has run continuously since 1979 with rotating international rhythm sections')."

      - phrase: premier
        banned_when: "Used as a PR-speak intensifier (e.g., 'Athens' premier nightlife destination', 'the city's premier jazz venue', 'the premier choice for'). Marketing copy with no informational content."
        allowed_when: "Used as part of an official designation, proper noun, or factually accurate ranking (e.g., 'Greek Premier League', 'the venue's premier — i.e., debut — performance of the season'). Note: 'premiere' as noun meaning first performance is a distinct word and always allowed."

      - phrase: iconic
        banned_when: "Used as a generic praise descriptor for venues, events, or neighborhoods (e.g., 'iconic Athens nightlife', 'an iconic venue', 'iconic vibe')."
        allowed_when: "Used in reference to a specific cultural icon or landmark with verifiable cultural-historical status and a concrete fact attached (e.g., 'the iconic 1973 Polytechnic protest', 'the iconic Acropolis silhouette visible from the rooftop')."

      - phrase: legendary
        banned_when: "Used as a generic praise descriptor (e.g., 'legendary night out', 'legendary chef', 'legendary venue'). Substitution test: works for any city, venue, or event without anchor."
        allowed_when: "Used in reference to verifiable cultural-legend status with a concrete supporting fact (e.g., 'Stoa Athanaton, where the Athens rebetiko revival began in the 1970s, carries that legacy through its current weekly programming')."

  el:
    absolute:
      # Σημείωση: Όλες οι μορφές κάθε επιθέτου ως ξεχωριστές καταχωρήσεις
      # (loader spec: flat strings, word-boundary match).
      # Καλύπτονται: ονομαστική / γενική / αιτιατική, ενικός & πληθυντικός,
      # αρσενικό / θηλυκό / ουδέτερο.
      # Πηγή v1.0: ED-greek-writing-guide.md ΜΕΡΟΣ 8 (4 families)
      # Επέκταση v1.1: parallel expansion με την επέκταση του EN absolute
      # (8 επιπλέον families). Πηγή: F1 hardcoded list parallels +
      # ED-greek-writing-guide §9 (εξαιρετική ακουστική explicitly flagged).

      # ─── καταπληκτικός — "amazing" (v1.0) ──────────────────────────────────
      - καταπληκτικός
      - καταπληκτική
      - καταπληκτικό
      - καταπληκτικού
      - καταπληκτικής
      - καταπληκτικοί
      - καταπληκτικές
      - καταπληκτικά
      - καταπληκτικών
      - καταπληκτικούς

      # ─── απίστευτος — "incredible" (v1.0) ──────────────────────────────────
      - απίστευτος
      - απίστευτη
      - απίστευτο
      - απίστευτου
      - απίστευτης
      - απίστευτοι
      - απίστευτες
      - απίστευτα
      - απίστευτων
      - απίστευτους

      # ─── εντυπωσιακός — "stunning/impressive" (v1.0) ───────────────────────
      - εντυπωσιακός
      - εντυπωσιακή
      - εντυπωσιακό
      - εντυπωσιακού
      - εντυπωσιακής
      - εντυπωσιακοί
      - εντυπωσιακές
      - εντυπωσιακά
      - εντυπωσιακών
      - εντυπωσιακούς

      # ─── αξέχαστος — "unforgettable" (v1.0) ────────────────────────────────
      - αξέχαστος
      - αξέχαστη
      - αξέχαστο
      - αξέχαστου
      - αξέχαστης
      - αξέχαστοι
      - αξέχαστες
      - αξέχαστα
      - αξέχαστων
      - αξέχαστους

      # ─── φανταστικός — "fantastic" (v1.1) ──────────────────────────────────
      - φανταστικός
      - φανταστική
      - φανταστικό
      - φανταστικού
      - φανταστικής
      - φανταστικοί
      - φανταστικές
      - φανταστικά
      - φανταστικών
      - φανταστικούς

      # ─── υπέροχος — "wonderful" (v1.1) ─────────────────────────────────────
      - υπέροχος
      - υπέροχη
      - υπέροχο
      - υπέροχου
      - υπέροχης
      - υπέροχοι
      - υπέροχες
      - υπέροχα
      - υπέροχων
      - υπέροχους

      # ─── τέλειος — "perfect" (v1.1) ────────────────────────────────────────
      # Edge-case: τέλειος can also mean "complete" in formal Greek
      # (e.g., "τέλειος και απόλυτος"). For our editorial domain, almost
      # always lazy praise. Kept absolute; promote to contextual only if
      # false-positive volume becomes a real burden.
      - τέλειος
      - τέλεια
      - τέλειο
      - τέλειου
      - τέλειας
      - τέλειοι
      - τέλειες
      - τέλειων
      - τέλειους

      # ─── θεαματικός — "spectacular" (v1.1) ─────────────────────────────────
      - θεαματικός
      - θεαματική
      - θεαματικό
      - θεαματικού
      - θεαματικής
      - θεαματικοί
      - θεαματικές
      - θεαματικά
      - θεαματικών
      - θεαματικούς

      # ─── εξαιρετικός — "excellent / exceptional" (v1.1) ────────────────────
      # Explicitly flagged in ED-greek-writing-guide §9: "εξαιρετική
      # ακουστική" listed as the bad example to replace with concrete
      # description ("Χαμηλά ταβάνια που συμπιέζουν τον ήχο...").
      # Edge-case: εξαιρετικός has formal/legal usage ("εξαιρετική
      # περίπτωση" = exceptional case). Outside our domain. Kept absolute.
      - εξαιρετικός
      - εξαιρετική
      - εξαιρετικό
      - εξαιρετικού
      - εξαιρετικής
      - εξαιρετικοί
      - εξαιρετικές
