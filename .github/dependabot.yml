# Dependabot version updates. Weekly, one grouped PR per ecosystem so the
# owner reviews one diff rather than a stream of single bumps. Security
# updates (enabled in the repo settings) still open on their own.
#
# `bun` rather than `npm`: the lockfile is bun.lock, which the npm ecosystem
# does not update, and ci installs with --frozen-lockfile.
#
# Every PR this opens touches a protected path (package.json, bun.lock or
# .github/workflows/), so path-guard marks it needs-input and the owner merges
# it by hand after review.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      bun-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]
