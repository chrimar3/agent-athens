# CodeQL static analysis (SAST) for the TypeScript sources: injection sinks,
# unsafe HTML building, shell-string construction and similar patterns that
# the unit tests only catch where someone thought to write a test.
#
# build-mode none: TypeScript is analysed from source, nothing is built or
# run. Results go to the repository's Security tab (code scanning).
#
# Least privilege: the workflow token is read-only; the analyze job alone gets
# security-events: write, which is what uploading results needs. The checkout
# keeps no token. Actions are pinned to full commit SHAs (resolved with
# `git ls-remote`); Dependabot bumps them with the version comment.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:javascript-typescript"
