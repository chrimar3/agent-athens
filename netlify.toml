# Netlify configuration for agent-athens

[build]
  # Builds disabled — site deployed via Netlify CLI
  publish = "dist"
  command = "echo 'Deploy via CLI - no build needed'"

# No serverless functions are deployed (security loop round 5: the unused
# /go/ click redirect, netlify/functions/go.ts, was removed — pinned by
# tests/security/no-click-redirect.test.ts).

# Deploy-B capability probe (GEO Ruling 2 sequel): does `--no-build --dir=dist`
# ship an edge function? Scoped to a throwaway path only — never real routes.
[[edge_functions]]
  path = "/__edge-probe"
  function = "edge-probe"

[dev]
  framework = "#custom"

# Redirect rules (optional - for future use)
[[redirects]]
  from = "/events"
  to = "/index.html"
  status = 200

# Site-wide security headers. Pinned by tests/netlify-headers.test.ts.
#
# X-XSS-Protection was removed: modern browsers ignore it and the old filter it
# enabled could itself be abused. CSP is the replacement.
#
# Content-Security-Policy (ENFORCED) carries only directives that cannot block
# a resource the pages load: no plugins, no <base> rewrites, no framing, forms
# post to this origin only, and http:// subresources are upgraded.
#
# Content-Security-Policy-Report-Only is the target strict policy. Browsers log
# its violations to the console without blocking anything (no report endpoint
# exists). Third-party loads, from the templates: GA4 (googletagmanager.com
# script; google-analytics.com / analytics.google.com beacons), Google Fonts
# (fonts.googleapis.com stylesheet, fonts.gstatic.com files), the OpenStreetMap
# embed on venue pages (frame), and event images hotlinked from source sites
# (any https host). The pages still rely on inline <script> blocks and inline
# onerror= handlers, which this policy does not allow; they must move to
# external files (or get hashes) before script-src can be enforced. Inline
# style= attributes are pervasive, so style-src keeps 'unsafe-inline'.
#
# HSTS: one year with includeSubDomains, no preload — preload is hard to undo
# and every subdomain would have to serve HTTPS first.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src https://www.openstreetmap.org; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"

[[headers]]
  for = "/api/*.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml"
    Cache-Control = "public, max-age=3600"

# HTML caching - refresh every hour since we update daily
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# OG images - refresh daily (regenerated each build)
[[headers]]
  for = "/images/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Self-hosted event images - cache for 1 day
[[headers]]
  for = "/images/events/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# CSS - refresh every hour (updated with daily builds)
[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Favicons - cache for 1 week (rarely change)
[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# /en bare path → /en/today (302 to preserve flexibility for future English homepage)
[[redirects]]
  from = "/en"
  to = "/en/today"
  status = 302
  force = true

[[redirects]]
  from = "/en/"
  to = "/en/today"
  status = 302
  force = true

# S132: collapse singular/plural hub cannibalization to a single canonical form.
# Singular forms (/concert, /theater, /exhibition, /performance) used to duplicate
# the curated category pages (/concerts, /theatre, /exhibitions, /performances)
# with identical Greek titles. Singulars are no longer built; redirect any
# remaining external links to the canonical plural form.
[[redirects]]
  from = "/concert"
  to = "/concerts"
  status = 301
  force = true

[[redirects]]
  from = "/theater"
  to = "/theatre"
  status = 301
  force = true

[[redirects]]
  from = "/exhibition"
  to = "/exhibitions"
  status = 301
  force = true

[[redirects]]
  from = "/performance"
  to = "/performances"
  status = 301
  force = true
