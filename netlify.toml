# Netlify configuration for agent-athens

[build]
  # Builds disabled — site deployed via Netlify CLI
  publish = "dist"
  command = "echo 'Deploy via CLI - no build needed'"

# Enable Netlify Functions
[functions]
  directory = "netlify/functions"

# Deploy-B capability probe (GEO Ruling 2 sequel): does `--no-build --dir=dist`
# ship an edge function? Scoped to a throwaway path only — never real routes.
[[edge_functions]]
  path = "/__edge-probe"
  function = "edge-probe"

# Enable Netlify Blobs for click storage
[dev]
  framework = "#custom"

# Redirect rules (optional - for future use)
[[redirects]]
  from = "/events"
  to = "/index.html"
  status = 200

# Headers for better caching and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/api/*.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml"
    Cache-Control = "public, max-age=3600"

# HTML caching - refresh every hour since we update daily
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# OG images - refresh daily (regenerated each build)
[[headers]]
  for = "/images/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Self-hosted event images - cache for 1 day
[[headers]]
  for = "/images/events/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# CSS - refresh every hour (updated with daily builds)
[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Favicons - cache for 1 week (rarely change)
[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# /en bare path → /en/today (302 to preserve flexibility for future English homepage)
[[redirects]]
  from = "/en"
  to = "/en/today"
  status = 302
  force = true

[[redirects]]
  from = "/en/"
  to = "/en/today"
  status = 302
  force = true

# S132: collapse singular/plural hub cannibalization to a single canonical form.
# Singular forms (/concert, /theater, /exhibition, /performance) used to duplicate
# the curated category pages (/concerts, /theatre, /exhibitions, /performances)
# with identical Greek titles. Singulars are no longer built; redirect any
# remaining external links to the canonical plural form.
[[redirects]]
  from = "/concert"
  to = "/concerts"
  status = 301
  force = true

[[redirects]]
  from = "/theater"
  to = "/theatre"
  status = 301
  force = true

[[redirects]]
  from = "/exhibition"
  to = "/exhibitions"
  status = 301
  force = true

[[redirects]]
  from = "/performance"
  to = "/performances"
  status = 301
  force = true
